<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>Advanced Online Quiz System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- Login Page -->

<div id="loginPage" class="login-box">

    <h1> Quiz Login</h1>

    <input type="text"
    id="usernameInput"
    placeholder="Enter Your Name">

    <button onclick="loginUser()">
        Login
    </button>

</div>

<!-- Main Quiz -->

<div class="container" id="mainContainer">

    <h1> Online Quiz System</h1>

    <!-- Buttons -->

    <button id="darkBtn">
         Dark Mode
    </button>

    <button id="voiceBtn">
         Voice Answer
    </button>

    <button id="logoutBtn"
    onclick="logoutUser()">
         Logout
    </button>

    <!-- STEP 4 ADDED HERE -->

    <input type="text"
    id="topic"
    placeholder="Enter Topic Like Java">

    <button onclick="startAI()"
    id="aiBtn">
         Generate AI Question
    </button>

    <!-- Progress -->

    <div class="progress">
        <div id="progressBar"></div>
    </div>

    <!-- Timer -->

    <h3 id="timer">
         Time Left: 15
    </h3>

    <!-- Quiz -->

    <div id="quiz">

        <h2 id="question"></h2>

        <label class="option">
            <input type="radio"
            name="answer"
            value="a">

            <span id="a_text"></span>
        </label>

        <label class="option">
            <input type="radio"
            name="answer"
            value="b">

            <span id="b_text"></span>
        </label>

        <label class="option">
            <input type="radio"
            name="answer"
            value="c">

            <span id="c_text"></span>
        </label>

        <label class="option">
            <input type="radio"
            name="answer"
            value="d">

            <span id="d_text"></span>
        </label>

        <button id="submit">
            Submit
        </button>

    </div>

    <!-- Leaderboard -->

    <div id="leaderboard"></div>

</div>

<!-- Certificate -->

<div id="certificateBox"
class="certificate-hidden">

    <div class="certificate">

        <h1>CERTIFICATE</h1>

        <h2>OF ACHIEVEMENT</h2>

        <p>
        This certificate is proudly
        presented to
        </p>

        <h2 id="certName"></h2>

        <p>
        Successfully completed the
        Computer Science Quiz Program
        conducted by
        </p>

        <h2 class="iit">
            IIT Bombay
        </h2>

        <h3 id="certScore"></h3>

        <p class="date"
        id="certDate"></p>

        <button onclick="closeCertificate()">
            Close
        </button>

    </div>

</div>

<!-- STEP 5 ADDED HERE -->

<script src="ai.js"></script>

<script src="script.js"></script>

</body>
</html>
